name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign only: skip notarization and release publishing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          python3 Kit/scripts/changelog.py > CHANGELOG.md
          if [ ! -s CHANGELOG.md ]; then
            echo "Battery charge threshold build." > CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=release::Signing secrets are not configured; running build-only dry run."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          p12-password: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Archive
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive -archivePath build/Stats.xcarchive
          else
            xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive -archivePath build/Stats.xcarchive CODE_SIGNING_ALLOWED=NO
          fi

      - name: Export
        if: steps.signing.outputs.available == 'true'
        run: |
          xcodebuild -exportArchive -exportOptionsPlist exportOptions.plist -archivePath build/Stats.xcarchive -exportPath build
          ditto -c -k --keepParent build/Stats.app build/Stats.zip

      - name: Stage app for packaging
        if: steps.signing.outputs.available != 'true'
        run: |
          cp -R build/Stats.xcarchive/Products/Applications/Stats.app build/Stats.app
          ditto -c -k --keepParent build/Stats.app build/Stats.zip

      - name: Notarize
        if: steps.signing.outputs.available == 'true' && inputs.dry_run != true
        run: |
          xcrun notarytool submit build/Stats.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --wait

      - name: Staple
        if: steps.signing.outputs.available == 'true' && inputs.dry_run != true
        run: xcrun stapler staple build/Stats.app

      - name: Verify signatures
        if: steps.signing.outputs.available == 'true'
        run: |
          codesign --verify --strict "build/Stats.app/Contents/PlugIns/WidgetsExtension.appex"
          app=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Stats.app/Contents/Info.plist)
          widget=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "build/Stats.app/Contents/PlugIns/WidgetsExtension.appex/Contents/Info.plist")
          echo "app: $app, widget: $widget"
          [ "$app" = "$widget" ] || { echo "ERROR: widget version does not match app version"; exit 1; }

      - name: Verify gatekeeper
        if: steps.signing.outputs.available == 'true' && inputs.dry_run != true
        run: spctl -a -t exec -vvv build/Stats.app

      - name: DMG
        run: |
          git clone --depth 1 https://github.com/create-dmg/create-dmg
          ./create-dmg/create-dmg \
            --volname Stats \
            --background "./Stats/Supporting Files/background.png" \
            --window-pos 200 120 \
            --window-size 500 320 \
            --icon-size 80 \
            --icon "Stats.app" 125 175 \
            --hide-extension "Stats.app" \
            --app-drop-link 375 175 \
            --no-internet-enable \
            build/Stats.dmg build/Stats.app
          rm -rf ./create-dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stats-${{ github.ref_name }}
          path: |
            build/Stats.dmg
            build/Stats.zip

      - name: Publish
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping publishing"
          else
            gh release create "$GITHUB_REF_NAME" build/Stats.dmg \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file CHANGELOG.md
          fi
